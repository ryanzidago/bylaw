# The repo root is the primary checkout of main, so fast-forward it from its
# upstream. The else branch covers a bare root, which has no
# primary_worktree_path: fetch into the bare repo and fast-forward the local
# default branch unless a worktree has it checked out. From a bare root,
# Worktrunk reads this file from the local default branch, so a hook that fails
# to expand also stops that branch from ever being refreshed.
# scripts/test-pre-switch-hook runs this hook through the pinned wt.
pre-switch = "{% if primary_worktree_path is defined %}if git -C {{ primary_worktree_path }} rev-parse --verify '@{upstream}' >/dev/null 2>&1; then git -C {{ primary_worktree_path }} fetch --quiet && BYLAW_WORKTREE_SWITCH=1 git -C {{ primary_worktree_path }} merge --ff-only '@{upstream}'; fi{% else %}git -C {{ repo_path }} fetch --quiet {{ remote }} && if ! git -C {{ repo_path }} worktree list --porcelain | grep -qx 'branch refs/heads/{{ default_branch }}'; then git -C {{ repo_path }} fetch --quiet {{ remote }} '{{ default_branch }}:{{ default_branch }}'; fi{% endif %}"

[pre-start]
hooks = "scripts/install-hooks"

[post-start]
copy_ignored = "wt step copy-ignored"

[pre-merge]
qa = "scripts/qa.sh"

[aliases]
qa = "scripts/qa.sh"
hooks = "scripts/install-hooks"
diff = "wt step diff"
prune = "wt step prune"
stack = "wt switch --create --base=@ {{ args }}"
